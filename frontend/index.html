<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>TrustVault — Zero-Knowledge Secure Document Sharing & Storage</title>
    <meta name="title" content="TrustVault — Zero-Knowledge Secure Document Sharing & Storage" />
    <meta name="description" content="TrustVault provides zero-knowledge secure document storage and sharing with end-to-end encryption, role-based access control, and comprehensive audit trails." />
    <meta name="keywords" content="secure document sharing, zero knowledge encryption, cloud vault, encrypted storage, access control, audit trail, TrustVault" />
    <meta name="author" content="TrustVault Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://trustvault.dev" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trustvault.dev/" />
    <meta property="og:title" content="TrustVault — Zero-Knowledge Secure Document Sharing & Storage" />
    <meta property="og:description" content="Store and share sensitive documents with end-to-end encryption, granular role-based permissions, and immutable audit logs." />
    <meta property="og:site_name" content="TrustVault" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://trustvault.dev/" />
    <meta property="twitter:title" content="TrustVault — Zero-Knowledge Secure Document Sharing & Storage" />
    <meta property="twitter:description" content="Store and share sensitive documents with end-to-end encryption, granular role-based permissions, and immutable audit logs." />

    <!-- Mobile & PWA -->
    <meta name="theme-color" content="#030712" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured Data (Schema.org JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TrustVault",
        "url": "https://trustvault.dev",
        "description": "Zero-knowledge secure document storage and sharing platform featuring end-to-end encryption, role-based access control, and complete audit logging.",
        "applicationCategory": "SecurityApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "End-to-End Encryption",
          "Role-Based Access Control (Admin, Owner, Viewer)",
          "HttpOnly Cookie Authentication",
          "Immutable Audit Trail",
          "Zero-Knowledge Architecture"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
